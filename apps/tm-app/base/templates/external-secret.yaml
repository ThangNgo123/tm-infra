apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: tm-app-secret
  namespace: {{ .Release.Namespace }}

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: tm-app-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretName }}
