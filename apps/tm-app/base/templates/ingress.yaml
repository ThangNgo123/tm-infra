apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: tm-ingress
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: traefik

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: tm-fe-service
                port:
                  number: 80

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: tm-be-service
                port:
                  number: 3000
