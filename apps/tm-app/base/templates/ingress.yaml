apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: tm-ingress
  namespace: {{ .Release.Namespace }}

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik

  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: tm-tls-secret

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tm-fe-service
                port:
                  number: 80

