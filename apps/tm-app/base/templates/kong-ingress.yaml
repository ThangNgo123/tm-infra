apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: tm-api-kong
  namespace: {{ .Release.Namespace }}

spec:
  ingressClassName: kong

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tm-be-service
                port:
                  number: 3000
