apiVersion: external-secrets.io/v1
kind: ClusterSecretStore

metadata:
  name: aws-secretsmanager

spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1

      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secret
            key: access-key
            namespace: external-secrets

          secretAccessKeySecretRef:
            name: aws-secret
            key: secret-access-key
            namespace: external-secrets
